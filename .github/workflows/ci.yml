# ============================================================================
# BigBrotr CI Pipeline
# ============================================================================
#
# Runs on push to main/develop and pull requests to main/develop.
# Jobs: pre-commit, unit-test (matrix), integration-test, docs, build (Docker)
#
# Job graph:
#   pre-commit ──┬──> unit-test (matrix: 3.11-3.14)
#                ├──> integration-test
#                ├──> docs
#                └──> build (matrix: bigbrotr/lilbrotr, main/develop only)
#
#   ci-success (gate for branch protection)
#     └──> needs: [pre-commit, unit-test, integration-test, docs, build]
#
# ============================================================================

name: CI

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - "docs/**"
      - "*.md"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/CODE_OF_CONDUCT.md"
      - ".github/SECURITY.md"
      - ".github/PULL_REQUEST_TEMPLATE.md"
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - "docs/**"
      - "*.md"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/CODE_OF_CONDUCT.md"
      - ".github/SECURITY.md"
      - ".github/PULL_REQUEST_TEMPLATE.md"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION_DEFAULT: "3.11"
  PYTHONUNBUFFERED: "1"

jobs:
  # --------------------------------------------------------------------------
  # Pre-commit: All linting, formatting, type checking, and security checks
  # --------------------------------------------------------------------------
  pre-commit:
    name: Pre-commit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION_DEFAULT }}

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Run pre-commit
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1

  # --------------------------------------------------------------------------
  # Unit Test: Run unit tests across Python versions
  # --------------------------------------------------------------------------
  unit-test:
    name: Unit Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: [pre-commit]
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - python-version: "3.14"
            allow-prereleases: true

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: ${{ matrix.allow-prereleases || false }}

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Audit dependencies
        run: uv run uv-secure uv.lock
        continue-on-error: ${{ matrix.python-version == '3.14' }}

      - name: Check SQL template drift
        run: uv run python tools/generate_sql.py --check

      - name: Run unit tests
        run: >-
          uv run pytest tests/
          --ignore=tests/integration/
          --cov=src/bigbrotr
          --cov-report=xml
          --cov-report=term-missing
          -v --tb=short
        env:
          DB_ADMIN_PASSWORD: test_password

      - name: Upload coverage
        if: matrix.python-version == '3.11' && github.actor != 'dependabot[bot]'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          # Coverage upload is auxiliary: a Codecov-side outage (e.g. GPG
          # signature verification failure) must not block merges.
          fail_ci_if_error: false
          verbose: true

  # --------------------------------------------------------------------------
  # Integration Test: Run integration tests with testcontainers
  # --------------------------------------------------------------------------
  integration-test:
    name: Integration Test
    runs-on: ubuntu-latest
    needs: [pre-commit]
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION_DEFAULT }}

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Run integration tests
        run: >-
          uv run pytest tests/integration/
          -v --tb=short --timeout=120
        env:
          DB_ADMIN_PASSWORD: test_password

  # --------------------------------------------------------------------------
  # Docs: Build documentation (strict mode)
  # --------------------------------------------------------------------------
  docs:
    name: Docs
    runs-on: ubuntu-latest
    needs: [pre-commit]
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION_DEFAULT }}

      - name: Install dependencies
        run: uv sync --frozen --group docs

      - name: Build documentation
        run: uv run mkdocs build --strict

  # --------------------------------------------------------------------------
  # Build: Docker images + security scan (main/develop only)
  # --------------------------------------------------------------------------
  build:
    name: Build (${{ matrix.deployment }})
    runs-on: ubuntu-latest
    needs: [pre-commit, unit-test, integration-test]
    timeout-minutes: 20
    permissions:
      security-events: write
      actions: read
      contents: read
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    strategy:
      fail-fast: false
      matrix:
        deployment: [bigbrotr, lilbrotr]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deployments/Dockerfile
          build-args: |
            DEPLOYMENT=${{ matrix.deployment }}
            VERSION=${{ github.sha }}
          push: false
          load: true
          tags: ${{ matrix.deployment }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.deployment }}
          cache-to: type=gha,scope=${{ matrix.deployment }},mode=max

      - name: Trivy scan (gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.deployment }}:${{ github.sha }}
          format: table
          exit-code: 1
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Trivy scan (SARIF report)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        if: always()
        with:
          image-ref: ${{ matrix.deployment }}:${{ github.sha }}
          format: sarif
          output: trivy-${{ matrix.deployment }}.sarif
          exit-code: 0
          ignore-unfixed: true
          severity: CRITICAL,HIGH,MEDIUM

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        if: always()
        with:
          sarif_file: trivy-${{ matrix.deployment }}.sarif
          category: trivy-${{ matrix.deployment }}

  # --------------------------------------------------------------------------
  # Gate: Summary job for branch protection
  # --------------------------------------------------------------------------
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    needs: [pre-commit, unit-test, integration-test, docs, build]
    if: always()
    steps:
      - name: Check results
        run: |
          if [[ "${{ needs.pre-commit.result }}" != "success" ]] || \
             [[ "${{ needs.unit-test.result }}" != "success" ]] || \
             [[ "${{ needs.integration-test.result }}" != "success" ]] || \
             [[ "${{ needs.docs.result }}" != "success" ]]; then
            echo "::error::One or more required jobs failed"
            echo "  pre-commit:       ${{ needs.pre-commit.result }}"
            echo "  unit-test:        ${{ needs.unit-test.result }}"
            echo "  integration-test: ${{ needs.integration-test.result }}"
            echo "  docs:             ${{ needs.docs.result }}"
            echo "  build:            ${{ needs.build.result }}"
            exit 1
          fi
          # build is allowed to be skipped (PRs don't trigger it)
          if [[ "${{ needs.build.result }}" != "success" && \
                "${{ needs.build.result }}" != "skipped" ]]; then
            echo "::error::Build failed: ${{ needs.build.result }}"
            exit 1
          fi
          echo "All required jobs passed"
